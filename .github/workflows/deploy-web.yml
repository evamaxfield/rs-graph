name: Deploy Web

on:
  workflow_dispatch: {}
  # Intentionally no `push` trigger yet -- planning ahead, not deploying yet.
  # When ready to go live, add:
  #   push:
  #     branches: [main]
  #     paths: ["web/site/**", "web/data-prep/output/**"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install site dependencies
        working-directory: web/site
        run: npm install

      - name: Build site
        working-directory: web/site
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/site/dist
