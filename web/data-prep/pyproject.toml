[project]
name = "rs-graph-web-data-prep"
description = "Precompute layer for the rs-graph docs/marketing site"
requires-python = ">=3.12"
dependencies = [
  "datasets>=3,<4",
  "polars>=1,<2",
  "pyarrow>=15",
  "python-dotenv>=1,<2",
  "huggingface_hub>=0.20",
  "sentence-transformers>=3,<4",
  "umap-learn>=0.5,<0.6",
  "scikit-learn>=1,<2",
  "numpy>=1,<3",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
