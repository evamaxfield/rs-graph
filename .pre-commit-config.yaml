repos:

  # Standard Python Files
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-format
        types_or: [ python, pyi ]
      - id: ruff-check
        args: ["--fix"]

  # Revert to mypy if desired
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.17.1
  #   hooks:
  #     - id: mypy

  - repo: local
    hooks:
      - id: zuban-check
        name: zuban check
        entry: zuban check
        language: system
        types: [python]
